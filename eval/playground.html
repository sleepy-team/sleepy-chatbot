<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Playground</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --user: #2f6fed; --answer: #1a7f4b; --partial: #b26a00; --unknown: #c0392b; --offtopic: #6b7280; --greeting: #7c4dff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; }
  header .cfg { color: var(--muted); font-size: 12px; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 120px; }
  .msg { margin: 12px 0; }
  .user { text-align: right; }
  .bubble { display: inline-block; max-width: 85%; padding: 10px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); text-align: left; white-space: pre-wrap; }
  .user .bubble { background: var(--user); color: #fff; border-color: var(--user); }
  .bot .bubble { border-left: 4px solid var(--mode, var(--line)); }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap;
    gap: 6px; align-items: center; }
  .badge { padding: 1px 8px; border-radius: 99px; color: #fff; background: var(--mode); font-weight: 600; }
  .chip { padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel);
    cursor: help; }
  .contact { margin-top: 8px; max-width: 85%; padding: 10px 14px; border-radius: 10px;
    border: 1px dashed var(--partial); background: #fff8ec; font-size: 13px; }
  details { margin-top: 4px; font-size: 12px; color: var(--muted); max-width: 85%; }
  details pre { white-space: pre-wrap; word-break: break-all; background: var(--panel);
    border: 1px solid var(--line); padding: 8px; border-radius: 8px; }
  .error { color: var(--unknown); }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 12px 16px; }
  form .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 10px 16px; font: inherit; border: 0; border-radius: 8px; background: var(--user);
    color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .reset { float: right; padding: 4px 10px; font-size: 12px; background: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>RAG Playground <span class="cfg">(개발용)</span>
    <button type="button" id="reset" class="reset">대화 초기화</button></h1>
  <div class="cfg" id="cfg">설정 불러오는 중…</div>
</header>
<main id="log"></main>
<form id="form">
  <div class="row">
    <input id="q" placeholder="질문을 입력하세요" maxlength="500" autocomplete="off" autofocus>
    <button id="send">전송</button>
  </div>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");
// 같은 대화의 이전 질문들. 서버는 대화를 저장하지 않으므로 화면이 들고 있다가 함께 보낸다
let asked = [];
document.getElementById("reset").addEventListener("click", () => {
  asked = [];
  log.replaceChildren();
  input.focus();
});
const MODE_COLOR = { answer: "var(--answer)", partial: "var(--partial)",
  unknown: "var(--unknown)", offtopic: "var(--offtopic)",
  greeting: "var(--greeting)" };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

fetch("/api/info").then(r => r.json()).then(info => {
  const c = info.config;
  document.getElementById("cfg").textContent =
    `${info.run} · ${info.embedding_model} · top_k ${c.retrieval?.top_k ?? "-"}` +
    ` · 키워드 ${c.retrieval?.keyword_slots ?? 0} · 이전 질문 ${c.retrieval?.history_turns ?? 0}` +
    ` · ${info.llm_model} · prompt ${c.generation?.prompt ?? "-"}`;
});

function addUser(text) {
  const m = el("div", "msg user");
  m.append(el("div", "bubble", text));
  log.append(m);
}

function addBot(r) {
  const m = el("div", "msg bot");
  m.style.setProperty("--mode", MODE_COLOR[r.mode] || "var(--line)");
  m.append(el("div", "bubble", r.answer));

  const meta = el("div", "meta");
  meta.append(el("span", "badge", r.mode));
  meta.append(el("span", "", `${(r.latency_ms / 1000).toFixed(1)}s · ${r.prompt_tokens + r.completion_tokens} tok`));
  for (const s of r.sources) {
    const chip = el("span", "chip", `${s.faq_id} ${s.score.toFixed(2)}`);
    chip.title = `[${s.category}] ${s.title}\n\n${s.excerpt}`;
    meta.append(chip);
  }
  m.append(meta);

  if (r.show_contact) {
    m.append(el("div", "contact", "담당자 문의 카드 (show_contact = true) — 프론트에서 문의 폼을 띄울 자리"));
  }
  if (r.reason) {
    const d = el("details");
    d.append(el("summary", "", "reason"), el("pre", "", r.reason));
    m.append(d);
  }
  const raw = el("details");
  raw.append(el("summary", "", "raw JSON"), el("pre", "", JSON.stringify(r, null, 2)));
  m.append(raw);
  log.append(m);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addUser(question);
  input.value = "";
  sendBtn.disabled = true;
  const pending = el("div", "msg bot meta", "생각 중…");
  log.append(pending);
  window.scrollTo(0, document.body.scrollHeight);
  try {
    const res = await fetch("/api/ask", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history: asked.slice(-5) }) });
    const data = await res.json();
    pending.remove();
    if (!res.ok) throw new Error(data.error || res.statusText);
    addBot(data);
    asked.push(question);
  } catch (err) {
    pending.remove();
    log.append(el("div", "msg error", `오류: ${err.message}`));
  } finally {
    sendBtn.disabled = false;
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
});
</script>
</body>
</html>
