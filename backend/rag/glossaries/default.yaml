# 검색 전 용어 정리 사전
#
# 고객 질문 속 오타·음차·줄임말을 FAQ에 쓰인 표준어로 바꾼 뒤 검색한다.
# 임베딩 검색은 핵심 단어가 변형되면 정답 FAQ를 못 찾기 때문이다 ("베터리" → 배터리 FAQ 미검색).
# LLM에는 고객의 원래 질문을 그대로 보낸다. 사전은 검색에만 쓴다.
#
# 형식: 표준어: [변형어, ...]
# - 변형어는 질문에 그대로 들어 있을 때만 바뀐다 (부분 문자열 일치, 대소문자 무시).
# - 다른 단어의 일부가 되는 짧은 변형어는 넣지 않는다 (엉뚱한 단어까지 바뀐다).
# - 뜻이 둘 이상으로 읽힐 수 있는 변형어는 넣지 않는다 (예: "출전").

배터리: [베터리, 밧데리, 빳데리, 바테리, 배러리]
AS 무상 수리 보증: [에이에스, 에이에쓰, A/S, a/s, 애프터서비스, 애프터 서비스]
블루투스: [블투, 블루투쓰]
충전: [충젼, 츙전]
이어팁: [이어 팁, 이어탭]
