# 슬리비 FAQ 챗봇 RAG 설정 (채택본)
name: default
owner: ""
description: "FAQ와 제품 정보를 함께 검색(후보 8개: 임베딩 7 + 키워드 1, 용어 사전으로 검색어 정리)하고, LLM 1회로 판단과 답변을 함께 만든다. 후속 질문은 직전 질문 1개를 참고해 두 검색 결과를 RRF로 합친다. 불만·담당자 연결 요청은 공감 문장 + 고정 안내 + 문의 카드로 답하고(API에는 unknown), 불만이 섞인 제품 질문은 답하면서 문의 카드를 띄운다. 고객이 쓴 언어로 답하고, 제품 질문에 섞인 진단·처방·역할 변경 요구는 한 문장으로 거절한다."

data_path: data/faq.json
extra_data_paths:
  - data/product.json

embedding:
  model: text-embedding-3-large

retrieval:
  top_k: 8
  keyword_slots: 1
  history_turns: 1
  history_merge: rrf
  glossary: default

decision:
  min_score: 0.15
  verify_numbers: true

generation:
  llm_model: gpt-6-luna
  prompt: default
  contact_email: sleeby00@gmail.com
