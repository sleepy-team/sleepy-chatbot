# 실험 설정. 결과를 낸 뒤에는 덮어쓰지 말고 새 파일로 복사해 수정한다.
name: hybrid-v1
data_dir: data
prompt_file: backend/rag/prompts/system.md

embedding:
  model: text-embedding-3-small

llm:
  model: gpt-4o-mini
  temperature: 0.0

chunking:
  chunk_size: 400
  chunk_overlap: 50

qdrant:
  # 하나만 지정: ":memory:" | 로컬 폴더 경로(path) | 서버 url
  location: ":memory:"
  path: null
  url: null
  collection: sleeby

retrieval:
  method: hybrid # vector | bm25 | hybrid
  top_k: 3
  bm25_weight: 0.4
  vector_weight: 0.6
